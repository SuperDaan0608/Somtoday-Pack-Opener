<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Somtoday Pack Opener</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <symbol id="i-galerij" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
      <symbol id="i-kaart" viewBox="0 0 24 24"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
      <symbol id="i-vrienden" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-rekenen" viewBox="0 0 24 24"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"/></symbol>
      <symbol id="i-proberen" viewBox="0 0 24 24"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></symbol>
      <symbol id="i-instellingen" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></symbol>
      <symbol id="i-geluiden" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></symbol>
      <symbol id="i-pakket" viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></symbol>
    </svg>

    <header class="kop">
      <div class="merk">
        <img src="icons/icon-48.png" width="30" height="30" alt="" />
        <div>
          <small>Somtoday</small>
          <strong>Pack Opener</strong>
        </div>
      </div>
      <span class="versie" id="versie"></span>
    </header>

    <!-- Je echte cijfers op Somtoday. De inhoud wordt door popup.js gevuld. -->
    <section class="somtoday" id="somtoday" aria-live="polite"></section>
    <p class="melding" id="melding" role="status" aria-live="polite"></p>

    <button type="button" class="hoofd" id="open-hub" data-hub="overzicht">
      <svg class="ico" aria-hidden="true"><use href="#i-pakket"/></svg>
      <span><strong>Open Pack Opener</strong><small>Alles in het Somtoday-venster</small></span>
    </button>

    <nav class="raster" aria-label="Onderdelen van de Pack Opener">
      <button type="button" data-hub="galerij"><svg class="ico" aria-hidden="true"><use href="#i-galerij"/></svg><span>Galerij</span></button>
      <button type="button" data-hub="kaart"><svg class="ico" aria-hidden="true"><use href="#i-kaart"/></svg><span>Kaart ontwerpen</span></button>
      <button type="button" data-hub="vrienden"><svg class="ico" aria-hidden="true"><use href="#i-vrienden"/></svg><span>Vrienden</span></button>
      <button type="button" data-hub="rekenen"><svg class="ico" aria-hidden="true"><use href="#i-rekenen"/></svg><span>Cijfercalculator</span></button>
      <button type="button" data-hub="instellingen"><svg class="ico" aria-hidden="true"><use href="#i-instellingen"/></svg><span>Instellingen</span></button>
      <button type="button" data-hub="proberen"><svg class="ico" aria-hidden="true"><use href="#i-proberen"/></svg><span>Proberen</span></button>
    </nav>

    <div class="meer">
      <span class="meer-kop" id="meer-kop">Meer</span>
      <button type="button" class="meer-knop" data-hub="geluiden" aria-describedby="meer-kop"><svg class="ico" aria-hidden="true"><use href="#i-geluiden"/></svg><span>Geluiden</span></button>
    </div>

    <p class="los" id="los" hidden><button type="button" class="tekstknop" id="los-knop">Zonder Somtoday openen, in een eigen tabblad</button></p>

    <footer class="voet">Fanproject · niet verbonden aan Somtoday of Topicus</footer>

    <script src="account.js"></script>
    <script src="poort.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
