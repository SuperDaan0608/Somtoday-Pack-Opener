<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Somtoday Pack Opener</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="kop">
      <div class="merk">
        <img src="icons/icon-48.png" width="30" height="30" alt="" />
        <div>
          <small>Somtoday</small>
          <strong>Pack Opener</strong>
        </div>
      </div>
      <span class="versie">0.4.1 bèta</span>
    </header>

    <!-- Je echte cijfers op Somtoday. De inhoud wordt door popup.js gevuld. -->
    <section class="somtoday" id="somtoday" aria-live="polite"></section>

    <details class="handmatig" id="handmatig">
      <summary>Handmatig proberen met een eigen cijfer</summary>

      <section class="voorbeeld" id="voorbeeld" aria-live="polite">
        <div class="mini-kaart" id="mini-kaart">
          <span class="mk-cijfer" id="mk-cijfer">7,5</span>
          <span class="mk-vak" id="mk-vak">WIS</span>
          <span class="mk-naam" id="mk-naam">Wiskunde</span>
        </div>
        <div class="voorbeeld-tekst">
          <span class="tier" id="tier-naam">Goud</span>
          <strong id="tier-label">Walkout!</strong>
          <span id="tier-uitleg">Vanaf een 7 krijg je een walkout.</span>
        </div>
      </section>

      <form id="formulier" autocomplete="off" novalidate>
        <label class="veld">
          <span>Vak</span>
          <input id="vak" list="vakken" maxlength="40" placeholder="bijv. Wiskunde" />
          <datalist id="vakken">
            <option value="Wiskunde"></option>
            <option value="Nederlands"></option>
            <option value="Engels"></option>
            <option value="Frans"></option>
            <option value="Duits"></option>
            <option value="Biologie"></option>
            <option value="Natuurkunde"></option>
            <option value="Scheikunde"></option>
            <option value="Geschiedenis"></option>
            <option value="Aardrijkskunde"></option>
            <option value="Economie"></option>
            <option value="Informatica"></option>
            <option value="Latijn"></option>
            <option value="Grieks"></option>
            <option value="Lichamelijke opvoeding"></option>
            <option value="CKV"></option>
            <option value="Maatschappijleer"></option>
          </datalist>
        </label>

        <div class="veld">
          <span>Cijfer</span>
          <div class="cijfer-rij">
            <input id="cijfer" inputmode="decimal" maxlength="4" placeholder="7,5" aria-label="Cijfer van 1 tot 10" />
            <input id="schuif" type="range" min="1" max="10" step="0.1" value="7.5" aria-label="Cijfer schuifregelaar" />
          </div>
        </div>

        <label class="veld">
          <span>Waar ging de toets over?</span>
          <input id="onderwerp" maxlength="80" placeholder="bijv. Hoofdstuk 4: Functies" />
        </label>

        <div class="veld">
          <span>Weging</span>
          <div class="segment" id="weging" role="group" aria-label="Weging">
            <button type="button" data-w="1">1×</button>
            <button type="button" data-w="2">2×</button>
            <button type="button" data-w="3">3×</button>
            <button type="button" data-w="4">4×</button>
          </div>
        </div>

        <button type="submit" class="open" id="open">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7.5 4.27 9 5.15M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
          Pakket openen
        </button>
        <p class="fout" id="fout" role="alert"></p>
      </form>

      <section class="geschiedenis" id="geschiedenis" hidden>
        <div class="g-kop">
          <strong>Recente pakketten</strong>
          <span id="gemiddelde"></span>
        </div>
        <ul id="lijst"></ul>
        <button type="button" class="wis" id="wis">Geschiedenis wissen</button>
      </section>
    </details>

    <section class="instellingen" aria-label="Instellingen">
      <div class="opening-keuze">
        <span class="ok-kop" id="ok-kop">Hoe wil je openen?</span>
        <div class="ok-raster" id="opening" role="radiogroup" aria-labelledby="ok-kop">
          <button type="button" role="radio" aria-checked="false" data-opening="pak"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2.2"/><path d="M6 7.5h12"/><path d="m12 10.5 1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z"/></svg><span>Pakje</span></button>
          <button type="button" role="radio" aria-checked="false" data-opening="kluis"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/><path d="M12 3v2.6M12 18.4V21M3 12h2.6M18.4 12H21M14.4 9.6l1.8-1.8M7.8 16.2l1.8-1.8"/></svg><span>Kluis</span></button>
          <button type="button" role="radio" aria-checked="false" data-opening="plinko"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="1.1"/><circle cx="8.6" cy="9" r="1.1"/><circle cx="15.4" cy="9" r="1.1"/><circle cx="5.2" cy="13.5" r="1.1"/><circle cx="12" cy="13.5" r="1.1"/><circle cx="18.8" cy="13.5" r="1.1"/><path d="M4 20.5h16M8.4 17v3.5M15.6 17v3.5"/></svg><span>Plinko</span></button>
          <button type="button" role="radio" aria-checked="false" data-opening="ster"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 3.5 1.4 3.2 3.2 1.4-3.2 1.4L15 12.7l-1.4-3.2-3.2-1.4 3.2-1.4z"/><path d="M10 13.5 3.5 20M12 17.5l-3.5 3.5M6.5 11 3 14.5"/></svg><span>Wensster</span></button>
          <button type="button" role="radio" aria-checked="false" data-opening="raket"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5c3 2.4 4.6 6 4.6 10l-2 3H9.4l-2-3c0-4 1.6-7.6 4.6-10Z"/><circle cx="12" cy="9" r="1.6"/><path d="M7.4 13 4 16.2V19l3.5-1.6M16.6 13l3.4 3.2V19l-3.5-1.6M10.4 19 12 22l1.6-3"/></svg><span>Raket</span></button>
          <button type="button" role="radio" aria-checked="false" data-opening="schiet"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span>Schieten</span></button>
          <button type="button" role="radio" aria-checked="false" data-opening="dans"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v6M12 9 6 6.5M12 9l6 2.5M12 13l-4 7M12 13l4.5 6"/></svg><span>Dansje</span></button>
          <button type="button" role="radio" aria-checked="false" data-opening="willekeurig"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span>Verras me</span></button>
        </div>
      </div>
      <label class="schakel"><input type="checkbox" id="afdekking" /><span class="knopje"></span><span class="schakel-tekst">Cijfers afdekken<small>Op Somtoday blijven nieuwe cijfers verborgen tot je ze opent.</small></span></label>
      <label class="schakel"><input type="checkbox" id="geluid" /><span class="knopje"></span><span class="schakel-tekst">Geluid</span></label>
      <label class="schakel"><input type="checkbox" id="snel" /><span class="knopje"></span><span class="schakel-tekst">Snelle modus<small>Kortere animatie.</small></span></label>
      <label class="schakel"><input type="checkbox" id="galerij" /><span class="knopje"></span><span class="schakel-tekst">Galerij bijhouden<small>Bewaart je geopende kaarten, alleen in deze browser.</small></span></label>
      <div class="links"><a class="link" href="galerij.html" target="_blank" rel="noopener">Mijn galerij</a><a class="link" href="geluiden.html" target="_blank" rel="noopener">Geluiden beluisteren</a></div>
    </section>

    <footer class="voet">Fanproject · niet verbonden aan Somtoday of Topicus</footer>

    <script src="popup.js"></script>
  </body>
</html>
